server {
    server_name api.fasttypinglab.com;

    client_max_body_size 5m;

    # Blocks known scraping-library and aggressive-crawler User-Agents before
    # the request reaches any location/proxy_pass below -- this API subdomain
    # has nothing for a search engine or SEO crawler to index (the real site
    # is the static frontend on GitHub Pages), so there is no cost to
    # rejecting them here, only abuse-traffic saved.
    #
    # Deliberately narrow: only unambiguous scripting-library/scraper
    # signatures, matched by substring. Empty or missing User-Agent is NOT
    # blocked -- legitimate non-browser callers (curl-based health checks,
    # uptime monitors, server-to-server calls) often send none, and that
    # case is already handled by design elsewhere (see the Origin check in
    # backend/middleware/requireBrowserOrigin.js). A real browser's
    # User-Agent never matches any of these.
    if ($http_user_agent ~* "python-requests|python-urllib|aiohttp|Scrapy|libwww-perl|Go-http-client|okhttp|SemrushBot|AhrefsBot|MJ12bot|DotBot|PetalBot|MegaIndex|BLEXBot|serpstatbot") {
        return 403;
    }

    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GoTrue sends its own permissive CORS headers (Access-Control-Allow-
        # Origin: *, etc.) on real responses, not just OPTIONS preflights.
        # Strip them here -- scoped to THIS location only, since putting this
        # at the server level once caused it to also strip the correct header
        # Express sets on its own routes via the catch-all location below.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin "https://fasttypinglab.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://fasttypinglab.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;

        add_header Access-Control-Allow-Origin "https://fasttypinglab.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://fasttypinglab.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Extra defense-in-depth in front of the app-level Origin check + rate
    # limiters in backend/middleware/requireBrowserOrigin.js and each route --
    # this rejects abusive traffic to our three public write endpoints at the
    # nginx layer, before it burns a Node event-loop tick or a Postgres write.
    # Requires these two lines in the http{} block of /etc/nginx/nginx.conf
    # (not per-site -- see docs/VPS-MIGRATION.md for the one-time server setup):
    #   limit_req_zone $binary_remote_addr zone=public_write_limit:10m rate=10r/m;
    #   limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=60r/m;
    location /api/visitors/track {
        limit_req zone=public_write_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000/api/visitors/track;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /test_sessions {
        limit_req zone=public_write_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000/test_sessions;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/certificates {
        limit_req zone=public_write_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000/api/certificates;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General safety net for the rest of the API surface -- looser than the
    # write-endpoint limit above since this also covers ordinary read/browse
    # traffic (test lists, leaderboard, etc.), not just the abused endpoints.
    # No CORS headers or proxy_hide_header here -- the Node backend (Express,
    # via cors()) is the sole source of truth for CORS on its own routes.
    # Nginx must not touch Access-Control-* headers on this location at all.
    location / {
        limit_req zone=api_general_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.fasttypinglab.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.fasttypinglab.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = api.fasttypinglab.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.fasttypinglab.com;
    return 404; # managed by Certbot


}
