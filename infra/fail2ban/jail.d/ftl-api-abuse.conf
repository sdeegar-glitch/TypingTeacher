# Auto-bans (at the OS/iptables level, via ufw) any IP that repeatedly trips
# the origin check or rate limit on our public write endpoints -- this is
# what actually stops a rotating-IP bot script over time: each new IP it
# tries gets banned again within a few requests instead of running
# indefinitely.
#
# Install: copy to /etc/fail2ban/jail.d/ftl-api-abuse.conf, then:
#   systemctl restart fail2ban
#   fail2ban-client status ftl-api-abuse   # verify it's active
#
# Requires the ufw action, which ships with fail2ban's default action.d/.
[ftl-api-abuse]
enabled  = true
filter   = ftl-api-abuse
logpath  = /var/log/nginx/access.log
# 6 rejected requests within 10 minutes -> ban. Loose enough that a real
# visitor who somehow trips a rate limit once isn't banned, but tight enough
# to catch a script that immediately retries after a 429/403.
findtime = 600
maxretry = 6
bantime  = 86400
action   = ufw
