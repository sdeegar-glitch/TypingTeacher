# Auto-bans any IP that repeatedly trips the origin check or rate limit on
# our public write endpoints -- this is what actually stops a rotating-IP
# bot script over time: each new IP it tries gets banned again within a few
# requests instead of running indefinitely.
#
# Two ban actions, for two different points in the origin-lockdown rollout:
#   - ufw: bans at this VPS's own firewall. Effective on its own before
#     infra/scripts/update-cloudflare-ufw.sh is deployed (traffic can still
#     reach this VPS directly). Once that lockdown is live, this action
#     becomes a harmless no-op against real internet abuse -- every request
#     arrives from a shared Cloudflare edge IP at the network layer, so
#     banning the real visitor's IP here has no effect. Left in place as
#     free defense-in-depth for the rare case Cloudflare is bypassed or
#     misconfigured.
#   - cloudflare-api: bans the real IP at Cloudflare's edge itself (WAF ->
#     IP Access Rules) via their API -- this is what actually matters once
#     the origin lockdown is live. See infra/fail2ban/action.d/cloudflare-
#     api.conf for one-time setup (API token + zone ID).
#
# Install: copy to /etc/fail2ban/jail.d/ftl-api-abuse.conf, then:
#   systemctl restart fail2ban
#   fail2ban-client status ftl-api-abuse   # verify it's active
[ftl-api-abuse]
enabled  = true
filter   = ftl-api-abuse
logpath  = /var/log/nginx/access.log
# 6 rejected requests within 10 minutes -> ban. Loose enough that a real
# visitor who somehow trips a rate limit once isn't banned, but tight enough
# to catch a script that immediately retries after a 429/403.
findtime = 600
maxretry = 6
bantime  = 86400
action   = ufw
           cloudflare-api
