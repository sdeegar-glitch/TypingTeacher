# Bans/unbans the offending IP directly at Cloudflare's edge (Security ->
# WAF -> IP Access Rules) instead of at the local OS firewall.
#
# Why this exists: once infra/scripts/update-cloudflare-ufw.sh has locked
# the VPS firewall down to only accept 80/443 from Cloudflare's IP ranges,
# every request arrives from one of Cloudflare's *shared* edge IPs at the
# network layer -- banning "the real visitor's IP" via ufw (the `ufw`
# action) has no effect at that point, because that IP never directly
# connects to this server. This action bans at the layer that actually
# matters post-lockdown: Cloudflare's own edge.
#
# --- One-time setup on the VPS ---
# 1. Create a scoped Cloudflare API token (not your Global API Key):
#    Cloudflare dashboard -> My Profile -> API Tokens -> Create Token ->
#    "Edit zone WAF" template (or custom: Zone / Firewall Services / Edit),
#    scoped to just the fasttypinglab.com zone.
# 2. Find the zone ID: Cloudflare dashboard -> fasttypinglab.com -> Overview
#    -> right sidebar -> "Zone ID".
# 3. Create /etc/fail2ban/cloudflare-api.env (chmod 600, NOT in this repo):
#      CF_API_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#      CF_ZONE_ID=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# 4. Copy the two helper scripts:
#      sudo mkdir -p /etc/fail2ban/scripts
#      sudo cp infra/fail2ban/scripts/cloudflare-ban.sh /etc/fail2ban/scripts/
#      sudo cp infra/fail2ban/scripts/cloudflare-unban.sh /etc/fail2ban/scripts/
#      sudo chmod 700 /etc/fail2ban/scripts/cloudflare-*.sh
# 5. Copy this file to /etc/fail2ban/action.d/cloudflare-api.conf
# 6. Reference `cloudflare-api` in a jail's `action` line (see
#    jail.d/ftl-api-abuse.conf), then `systemctl restart fail2ban`.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban   = /etc/fail2ban/scripts/cloudflare-ban.sh <ip>
actionunban = /etc/fail2ban/scripts/cloudflare-unban.sh <ip>
