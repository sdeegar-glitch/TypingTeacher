# Matches requests to any of the public write endpoints that get rejected --
# 429 (nginx limit_req_zone or the app's own express-rate-limit tripped) or
# 403 (the app-level Origin check in backend/middleware/requireBrowserOrigin.js
# rejected it). Covers all three endpoints hardened against direct-script
# abuse: visit tracking, test-session submission, and certificate issuance.
#
# test_sessions additionally counts its own 400s: backend/routes/test_sessions.js
# rejects a session whose duration/WPM combination is not humanly plausible
# (implausibleSessionReason()) with a 400, the same class of scripted-abuse
# signal as the 429/403 above -- a real client is very unlikely to trip this
# repeatedly, since it means the same submission "shape" it produces from a
# genuine test result was rejected six times running.
#
# Install: copy to /etc/fail2ban/filter.d/ftl-api-abuse.conf
[Definition]
failregex = ^<HOST> -.*"(POST|GET) /(api/visitors/track|api/certificates)[^"]*" (429|403) .*$
            ^<HOST> -.*"POST /test_sessions[^"]*" (429|403|400) .*$
ignoreregex =
