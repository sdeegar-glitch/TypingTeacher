# Matches requests to the public visit-tracking endpoint that nginx itself
# rejected -- 429 (nginx limit_req_zone tripped, see api.fasttypinglab.com.conf)
# or 403 (would only reach nginx as 403 if proxied through from the app;
# normally the app-level Origin check in backend/routes/visitors.js returns
# its own 403 straight from Node, which still shows up in this same log line
# format since nginx logs the upstream's status code).
#
# Install: copy to /etc/fail2ban/filter.d/ftl-track-abuse.conf
[Definition]
failregex = ^<HOST> -.*"(POST|GET) /api/visitors/track[^"]*" (429|403) .*$
ignoreregex =
